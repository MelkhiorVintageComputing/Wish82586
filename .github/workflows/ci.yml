name: CI

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog yosys build-essential

      - name: Lint (Verilator)
        run: make lint

      - name: Parse check (Icarus)
        run: make lint-icarus

      - name: Elaboration check (Yosys)
        run: make synth

      - name: Regression
        run: make test FLAGS=--no-colour
